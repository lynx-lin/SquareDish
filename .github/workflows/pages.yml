name: Deploy game to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Stage runtime files
        run: |
          mkdir -p _site
          cp index.html styles.css game.js audio.js _site/
          if [ -d asset ]; then cp -R asset _site/; fi
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
          include-hidden-files: true
      - name: Wait for Pages artifact
        run: sleep 15
      - id: deployment
        uses: actions/deploy-pages@v5
